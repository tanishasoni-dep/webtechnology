<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityCare Hospital - Patient Registration</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="brand">
        <i class="fa-solid fa-hospital-user logo-icon"></i>
        <div>
          <h1>CityCare Hospital</h1>
          <p>Online Patient Registration Portal</p>
        </div>
      </div>
      <button id="themeToggle" class="theme-btn">
        <i class="fa-solid fa-moon"></i> Dark Mode
      </button>
    </header>

    <main class="form-card">
      <h2><i class="fa-solid fa-id-card"></i> Patient Details</h2>
      <p class="subtitle">Please fill out all mandatory fields accurately.</p>

      <form id="registrationForm" novalidate>
        
        <!-- Row 1: Full Name & Mobile Number -->
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Full Name <span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user icon"></i>
              <input type="text" id="fullName" placeholder="e.g. Rahul Sharma" autocomplete="off">
            </div>
            <small class="error-msg" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number <span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="fa-solid fa-phone icon"></i>
              <input type="text" id="mobile" placeholder="10-digit mobile number" maxlength="10">
            </div>
            <small class="error-msg" id="mobileError"></small>
          </div>
        </div>

        <!-- Row 2: Email & Date of Birth -->
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope icon"></i>
              <input type="email" id="email" placeholder="e.g. rahul@example.com">
            </div>
            <small class="error-msg" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth <span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="fa-solid fa-calendar-days icon"></i>
              <input type="date" id="dob">
            </div>
            <small class="info-text" id="ageInfo"></small>
            <small class="error-msg" id="dobError"></small>
          </div>
        </div>

        <!-- Row 3: Gender & Blood Group -->
        <div class="form-row">
          <div class="form-group">
            <label>Gender <span class="required">*</span></label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="Male"> Male</label>
              <label><input type="radio" name="gender" value="Female"> Female</label>
              <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <small class="error-msg" id="genderError"></small>
          </div>

          <div class="form-group">
            <label for="bloodGroup">Blood Group <span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="fa-solid fa-droplet icon"></i>
              <select id="bloodGroup">
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>
            <small class="error-msg" id="bloodGroupError"></small>
          </div>
        </div>

        <!-- Row 4: Password & Confirm Password -->
        <div class="form-row">
          <div class="form-group">
            <label for="password">Create Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock icon"></i>
              <input type="password" id="password" placeholder="Min. 8 chars (letters, digits, symbols)">
              <i class="fa-solid fa-eye toggle-pwd" id="togglePassword"></i>
            </div>
            <!-- Dynamic Strength Bar -->
            <div class="strength-meter"><div id="strengthBar"></div></div>
            <small class="error-msg" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock icon"></i>
              <input type="password" id="confirmPassword" placeholder="Re-enter password">
            </div>
            <small class="error-msg" id="confirmPasswordError"></small>
          </div>
        </div>

        <!-- Checkbox & Submit -->
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="terms"> I agree to the <a href="#">Terms & Privacy Policy</a>
          </label>
          <small class="error-msg" id="termsError"></small>
        </div>

        <button type="submit" class="submit-btn"><i class="fa-solid fa-check-circle"></i> Register Patient</button>
      </form>
    </main>

    <!-- Success Output Section -->
    <section id="summarySection" class="summary-card hidden">
      <h2><i class="fa-solid fa-circle-check"></i> Registration Successful!</h2>
      <p>The patient record has been locally validated and created.</p>
      <div id="summaryContent"></div>
      <button id="resetBtn" class="reset-btn"><i class="fa-solid fa-user-plus"></i> Register Another Patient</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
