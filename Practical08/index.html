<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        TechMart Product Management
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <h1>
        TechMart Product Management
    </h1>


    <!-- ADD / UPDATE FORM -->

    <div class="card">

        <h2>
            Product Details
        </h2>


        <form id="productForm">

            <input
                type="hidden"
                id="productId">


            <label>
                Product Name
            </label>

            <input
                type="text"
                id="name"
                required>


            <label>
                Category
            </label>

            <input
                type="text"
                id="category"
                required>


            <label>
                Price
            </label>

            <input
                type="number"
                id="price"
                min="1"
                step="0.01"
                required>


            <label>
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                min="0"
                required>


            <label>
                Description
            </label>

            <textarea
                id="description">
            </textarea>


            <button
                type="submit"
                id="submitButton">

                Add Product

            </button>


            <button
                type="button"
                id="cancelButton"
                onclick="resetForm()">

                Clear

            </button>

        </form>


        <p id="message"></p>

    </div>


    <!-- PRODUCT TABLE -->

    <div class="card">

        <h2>
            Product List
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Category</th>

                        <th>Price</th>

                        <th>Quantity</th>

                        <th>Description</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody
                    id="productTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
