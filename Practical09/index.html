<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickShop Marketplace</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <h1>QuickShop Online Marketplace</h1>

    <p>REST API Product Management</p>

</header>


<main>

    <section>

        <h2>Product Information</h2>

        <button onclick="loadProducts()">
            Load Products
        </button>

        <p id="message"></p>

        <div id="products"
             class="product-container">

        </div>

    </section>


    <section>

        <h2>Add New Product</h2>

        <form id="productForm">

            <input
                type="text"
                id="name"
                placeholder="Product Name"
                required
            >

            <input
                type="text"
                id="category"
                placeholder="Category"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Price"
                min="1"
                required
            >

            <input
                type="number"
                id="stock"
                placeholder="Stock"
                min="0"
                required
            >

            <button type="submit">
                Add Product
            </button>

        </form>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
